# uair blink states: alternating between these two gives the flashing effect
# (see ~/.config/uair/blink-notify.sh)
[category=uair]
background-color={{colors.tertiary_container.default.hex}}
text-color={{colors.on_tertiary_container.default.hex}}
border-color={{colors.tertiary.default.hex}}

# inverted, so alternating with [category=uair] flashes the popup
[category=uair-blink]
background-color={{colors.on_tertiary_container.default.hex}}
text-color={{colors.tertiary_container.default.hex}}
border-color={{colors.tertiary.default.hex}}

