#:schema https://yazi-rs.github.io/schemas/theme.json

# : Manager [[[

[mgr]
cwd = { fg = "#dde4e3" }

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#6ca7ff", bg = "#6ca7ff" }
marker_cut = { fg = "#d2e4ff", bg = "#d2e4ff" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#b2c8e8", bg = "#b2c8e8" }

# Count
count_copied = { fg = "#031c35", bg = "#d2e4ff" }
count_cut = { fg = "#031c35", bg = "#d2e4ff" }
count_selected = { fg = "#003736", bg = "#b2c8e8" }

# Border
border_symbol = "│"
border_style  = { fg = "#80d5d2" }

# : ]]]


# : Tabs [[[

[tabs]
